name: Build BaoBoiAgent .deb (Rootful + Rootless)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@main

      - name: Build rootful .deb (iOS 14+, checkra1n/unc0ver/Taurine)
        run: |
          rm -rf packages/
          # Không set THEOS_PACKAGE_SCHEME = mặc định là rootful (cài vào /Library/MobileSubstrate)
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e" TARGET="iphone:clang:16.5:14.0"
          ls packages/
          for f in packages/*.deb; do
            mv "$f" "${f%.deb}_rootful.deb"
          done
          ls packages/

      - name: Build rootless .deb (iOS 15+/16+, Dopamine/palera1n/Serotonin)
        run: |
          # THEOS_PACKAGE_SCHEME=rootless: cài vào /var/jb/Library/MobileSubstrate
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e" TARGET="iphone:clang:16.5:15.0"
          ls packages/
          for f in packages/*.deb; do
            if [[ "$f" != *_rootful.deb ]] && [[ "$f" != *_rootless.deb ]]; then
              mv "$f" "${f%.deb}_rootless.deb"
            fi
          done
          ls packages/

      - name: Upload both .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaoBoiAgent-deb
          path: ${{ github.workspace }}/packages/*.deb
          retention-days: 30
