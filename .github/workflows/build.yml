name: Build BaoBoiAgent .deb

on:
  push:
    paths:
      - 'tweak/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q curl wget git make findutils ldid dpkg-dev

      - name: Download iOS SDK
        run: |
          mkdir -p theos/sdks
          wget -q "https://github.com/theos/sdks/archive/master.tar.gz" -O sdks.tar.gz
          tar -xzf sdks.tar.gz --strip-components=1 -C theos/sdks
          ls theos/sdks/

      - name: Build tweak
        working-directory: tweak
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
        run: |
          make package FINALPACKAGE=1 THEOS=$THEOS THEOS_MAKE_PATH=$THEOS_MAKE_PATH
          ls packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaoBoiAgent-deb
          path: tweak/packages/*.deb
          retention-days: 30

      - name: Upload to Bao Boi Dashboard
        if: ${{ secrets.BAOBOI_UPLOAD_TOKEN != '' }}
        run: |
          DEB_FILE=$(ls tweak/packages/*.deb | head -1)
          echo "Uploading $DEB_FILE to dashboard..."
          curl -X POST "https://baoboidash.com/api/trpc/tweak.uploadRelease" \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer ${{ secrets.BAOBOI_UPLOAD_TOKEN }}" \
            -F "file=@$DEB_FILE" \
            -F "version=1.2.0" \
            -F "changelog=Cap nhat URL scheme baoboi:// de kich hoat qua link" \
            --fail-with-body || echo "Upload failed, check token"
