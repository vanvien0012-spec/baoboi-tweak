name: Build BaoBoiAgent .deb

on:
  push:
    paths:
      - 'tweak/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q curl wget git make findutils ldid dpkg-dev clang

      - name: Download iOS SDK
        run: |
          mkdir -p theos/sdks
          wget -q "https://github.com/theos/sdks/archive/master.tar.gz" -O sdks.tar.gz
          tar -xzf sdks.tar.gz --strip-components=1 -C theos/sdks
          ls theos/sdks/

      - name: Build tweak
        working-directory: tweak
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
        run: |
          make package FINALPACKAGE=1
          ls packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaoBoiAgent-deb
          path: tweak/packages/*.deb
          retention-days: 30
